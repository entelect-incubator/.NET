name: .NET - Phase 3 - Final Solution

on:
    push:
        branches: [ main, master ]
        paths:
            - "Phase 3/**"
            - ".github/workflows/dotnet-phase3-finalsolution.yml"
    pull_request:
        branches: [ main, master ]
        paths:
            - "Phase 3/**"
            - ".github/workflows/dotnet-phase3-finalsolution.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Install dependencies
              run: dotnet restore "./Phase 3/src/03. EndSolution/Pezza.slnx"
            - name: Build
              run: dotnet build "./Phase 3/src/03. EndSolution/Pezza.slnx" --configuration
                  Release --no-restore
