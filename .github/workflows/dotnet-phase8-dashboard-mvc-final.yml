name: .NET - Phase 8 - Portal - MVC - Final

on:
    push:
        branches: [main, master]
        paths:
            - "Phase 8/**"
            - ".github/workflows/dotnet-phase8-dashboard-mvc-final.yml"
    pull_request:
        branches: [main, master]
        paths:
            - "Phase 8/**"
            - ".github/workflows/dotnet-phase8-dashboard-mvc-final.yml"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Install dependencies
              run: dotnet restore "./Phase 8/src/03. MVC/Pezza.slnx"
            - name: Build
              run:
                  dotnet build "./Phase 8/src/03. MVC/Pezza.slnx" --configuration Release
                  --no-restore
