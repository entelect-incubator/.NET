name: Docs Spell Fix (codespell)

on:
    workflow_dispatch:
        inputs:
            auto_fix:
                description: "When true the workflow will run codespell --write-changes, commit and open a PR"
                required: false
                default: "false"

jobs:
    codespell-fix:
        runs-on: windows-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Install codespell
              run: |
                  python -m pip install --upgrade pip
                  pip install codespell

            - name: Build ignore list from Docs spell file
              shell: pwsh
              id: build-ignore
              run: |
                  $path = 'Docs/spell/accepted-words.txt'
                  if (Test-Path $path) {
                    $words = Get-Content $path | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' }
                    $ignore = $words -join ','
                  } else {
                    $ignore = 'Pezza,Nuget,Net,net10,Entelect'
                  }
                  Write-Host "::set-output name=ignore::$ignore"

            - name: Run codespell (dry-run)
              shell: pwsh
              run: |
                  $ignore = "${{ steps.build-ignore.outputs.ignore }}"
                  $mds = (git ls-files '*.md') -split "`n" | Where-Object { $_ -ne '' }
                  if (-not $mds) { Write-Host "No markdown files to check."; exit 0 }
                  Write-Host "Running codespell (dry-run) on markdown files with ignore list: $ignore"
                  Write-Host $mds -Separator "`n"
                  codespell -q 3 --ignore-words-list="$ignore" $mds || true

            - name: Auto-fix and open PR (when requested)
              id: create-pr
              if: ${{ github.event.inputs.auto_fix == 'true' }}
              uses: actions/github-script@v6
              with:
                  script: |
                      const exec = require('child_process').execSync;
                      const ignore = '${{ steps.build-ignore.outputs.ignore }}';
                      console.log('Running codespell --write-changes on tracked markdown files');
                      const mdFiles = exec('git ls-files "*.md"').toString().trim().split(/\r?\n/).filter(Boolean).map(s => s.replace(/"/g,'\\"')).join(' ');
                      if (!mdFiles) { console.log('No markdown files to fix'); return; }
                      exec(`codespell -w --ignore-words-list="${ignore}" ${mdFiles}`, { stdio: 'inherit' });
                      // create a branch, commit changes and push
                      const branch = `docs/spellfix-${new Date().toISOString().replace(/[:.]/g,'-')}`;
                      exec(`git checkout -b ${branch}`, { stdio: 'inherit' });
                      try {
                        exec('git add -A', { stdio: 'inherit' });
                        exec('git commit -m "chore(docs): apply codespell fixes (auto)"', { stdio: 'inherit' });
                      } catch (e) {
                        console.log('No changes to commit');
                        return;
                      }
                      exec(`git push --set-upstream origin ${branch}`, { stdio: 'inherit' });
                      // create a pull request via GitHub REST API
                      const pr = await github.rest.pulls.create({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        title: 'chore(docs): apply codespell fixes (auto)',
                        head: branch,
                        base: github.context.ref.replace('refs/heads/','') || 'upgrade/all-net10',
                        body: 'This PR applies high-confidence spelling fixes generated by codespell. Please review before merging.'
                      });
                      return pr.data.html_url;

            - name: Output PR URL
              if: ${{ always() && github.event.inputs.auto_fix == 'true' }}
              run: |
                  echo "PR created: ${{ steps.create-pr.outputs.result }}"
