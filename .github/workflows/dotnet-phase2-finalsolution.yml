name: .NET - Phase 2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: dotnet restore "./Phase 2/src/02. EndSolution/Pezza.slnx"
      - name: Build
        run: dotnet build "./Phase 2/src/02. EndSolution/Pezza.slnx" --configuration
          Release --no-restore
