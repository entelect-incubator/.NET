name: Docs Validation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/**"
  push:
    branches: [ "upgrade/all-net10", "main", "master" ]
    paths:
      - "**/*.md"

jobs:
  validate-docs:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"

      - name: Build all solutions found
        shell: pwsh
        run: |
          $slns = Get-ChildItem -Path . -Recurse -File -Include *.sln,*.slnx | Select-Object -ExpandProperty FullName
          if (-not $slns) { Write-Host "No solution files found."; exit 0 }
          foreach ($sln in $slns) {
            Write-Host "Building $sln"
            dotnet build $sln -c Release
          }

      - name: Setup Python for spellcheck
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install codespell
        run: |
          python -m pip install --upgrade pip
          pip install codespell

      - name: Run codespell (low-noise check)
        shell: pwsh
        run: |
          # Only run codespell against tracked Markdown files to avoid noise from minified/binary assets
          $ignore = 'Pezza,Nuget,Net,net10,Entelect'
          $mds = (git ls-files '*.md') -split "`n" | Where-Object { $_ -ne '' }
          if (-not $mds) { Write-Host "No markdown files to check."; exit 0 }
          Write-Host "Running codespell on markdown files:`n$($mds -join "`n")"
          codespell -q 3 --ignore-words-list="$ignore" $mds || true
