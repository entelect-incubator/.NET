name: .NET - Phase 6 - Step 1

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x
            - name: Install dependencies
              run: dotnet restore "./Phase 6/src/02. Step 1/Pezza.slnx"
            - name: Build
              run: dotnet build "./Phase 6/src/02. Step 1/Pezza.slnx" --configuration Release
                  --no-restore
