name: .NET - Phase 7 - Dashboard - MVC - Step 2

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: dotnet restore "./Phase 7/src/04. Step 3/Pezza.slnx"
      - name: Build
        run: dotnet build "./Phase 7/src/04. Step 3/Pezza.slnx" --configuration Release
          --no-restore
