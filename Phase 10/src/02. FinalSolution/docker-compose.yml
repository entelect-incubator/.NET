version: '3.8'

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: pezza-sql-server
    environment:
      SA_PASSWORD: "YourComplexPassword123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - pezza-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourComplexPassword123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: pezza-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "RootPassword123!"
      MYSQL_DATABASE: "pezza_db"
      MYSQL_USER: "pezza_user"
      MYSQL_PASSWORD: "UserPassword123!"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pezza-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sql-data:
  mysql-data:

networks:
  pezza-network:
    driver: bridge
